[project]
name = "pave-api"
version = "0.1.0"
description = "API do PAVE — painel de monitoramento da conversa eleitoral"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "firebase-admin>=6.6",
]

[dependency-groups]
dev = ["ruff>=0.8", "pytest>=8.3", "pytest-asyncio>=0.24", "httpx>=0.28"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
ignore = ["B008"]
