services:
  fastapi:
    build: ./api
    container_name: pave_api
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - /home/labpi/pave-pipeline/data/fotos:/app/fotos:ro
    networks:
      - pave_network

  nextjs_front:
    build: ./frontend
    ports:
      - "3000:3000"
    # O front geralmente fala com a API via requisição HTTP (localhost:8000), 
    # então ele não precisa necessariamente estar na rede do banco.

# Declaração da rede externa
networks:
  pave_network:
    external: true